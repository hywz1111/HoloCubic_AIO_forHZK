[env:hazuki_gift]
platform = espressif32 @ 3.5.0
board = pico32
framework = arduino
lib_extra_dirs = ../AIO_Firmware_PIO/lib
lib_ldf_mode = chain+
monitor_speed = 115200
upload_speed = 460800
board_build.f_cpu = 240000000L
board_build.f_flash = 40000000L
board_build.flash_mode = dio
board_build.partitions = partitions.csv
build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=-1
    -D TFT_DC=2
    -D TFT_RST=4
    -D LOAD_GLCD=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=10000000
    -Wall
    -Werror=return-type
